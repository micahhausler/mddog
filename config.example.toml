# Example mddog config. Copy it to ~/.config/mddog/config.toml, or to
# $XDG_CONFIG_HOME/mddog/config.toml if XDG_CONFIG_HOME is set.
# Every value here is the default, so you only need the keys you change.
# An unknown key or a bad value stops mddog with an error that names the key.

# One theme, such as "github-dark", or one for each macOS appearance as below.
# A theme is a built-in name (github-light, github-dark, obsidian-light, obsidian-dark)
# or a path to a theme file (any value that ends in .css or contains /). "light:obsidian-light,dark:obsidian-dark" looks like Obsidian.
# A theme file sets colors, fonts, sizes, weights and a layout (github or obsidian) as tokens. A relative path starts from the config folder,
# and ~/ is your home. To write one, see docs/themes.md.
theme = "light:github-light,dark:github-dark"

# Copy the text you select with a mouse drag or a double-click, as soon as you let go.
copy_on_select = false

# How to read a `> [!kind]` block. "github" shows only what github.com shows: GitHub's five kinds,
# with no title. "obsidian" reads it as Obsidian does: any kind and its aliases, a title on the first line,
# a fold marker (+ or -), and nested callouts.
callouts = "github"

# The command that opens web and mail links, with the link added as its last argument,
# or put where an argument says {url}. The default is ["open"] on macOS and ["xdg-open"] on Linux.
# Change it when mddog runs on another machine than the one you sit at, so links open in front
# of you. The link comes from the file, so never pass it to ssh as an argument, which runs it
# through a shell. Send it as input instead:
# open_command = ["sh", "-c", "printf '%s\\n' \"$0\" | ssh my-laptop 'read -r u && open \"$u\"'", "{url}"]

# The page's widest width, in terminal cells. A wider window centers the page, with equal margins on each side.
# 100 sits between GitHub's file view (1012 px, about 120 characters) and Obsidian's readable line length
# (700 px, about 85 to 90 characters). Use 20 or more, or a large number such as 10000 for no cap.
max_width = 100

[file_list]
# The file extensions the file list (mdd, mdd FOLDER, Ctrl-p) shows, that "Did you mean" picks from,
# and that a relative link opens in mddog. This is the full list. Write each one without the dot.
# mdd FILE opens any text file, whatever its extension.
extensions = ["md", "markdown"]

# The file list (Ctrl-p) shows the top of the selected file next to the list. Ctrl-t hides or shows it until you quit.
[file_list.preview]
# Which side of the list it goes on: "right", "left", "top" or "bottom".
position = "right"
# Cells, such as 80, or a percentage of the width (or height, when above or below), such as "50%".
# The list always keeps at least 40 columns, or 10 rows, and a preview under 30 columns, or 8 rows, is hidden.
size = "50%"
# A window narrower than this many columns uses narrow_position and narrow_size instead.
narrow_columns = 120
# Where the preview goes in a narrow window: "right", "left", "top", "bottom", or "hidden".
narrow_position = "bottom"
# The preview's size in a narrow window. Leave it out to use size.
# narrow_size = "50%"
# false starts with the preview hidden, and Ctrl-t shows it.
show_by_default = true
